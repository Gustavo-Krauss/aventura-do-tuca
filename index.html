<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aventura do Tuca — jogo educativo para a Pré-escola II (5 e 6 anos): tamanhos, números, cores e letras.">
  <meta name="theme-color" content="#38bdf8">
  <title>Aventura do Tuca</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%9D%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Fundo decorativo (nuvens) -->

    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>

  <!-- Todas as telas são desenhadas aqui pelo js/app.js -->

</html>
